spring.application.name=mony-backend

# DB接続。URL・ユーザーの既定値は docker-compose.yml と一致。パスワードはファイルに書かず、Spring Boot 標準の環境変数 SPRING_DATASOURCE_PASSWORD で必ず指定する（既定値なし）。
spring.datasource.url=${MONY_DB_URL:jdbc:postgresql://localhost:5432/mony}
spring.datasource.username=${MONY_DB_USER:mony}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Spring Session（JDBC）。セッション用テーブルを起動時に自動作成する（業務テーブルの初期化とは独立）。
spring.session.jdbc.initialize-schema=always

# 業務テーブル。src/main/resources/schema.sql を毎回の起動で実行する（CREATE TABLE IF NOT EXISTS のため冪等）。
spring.sql.init.mode=always

server.port=${MONY_SERVER_PORT:8080}
